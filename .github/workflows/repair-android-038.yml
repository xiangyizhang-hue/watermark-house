name: Repair Android 0.3.8 release assets

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-android-038.yml']

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'ci: repair Android 0.3.8 release assets'
    runs-on: ubuntu-latest
    steps:
      - name: Check out archived APK
        uses: actions/checkout@v4
        with:
          ref: release-assets-android-v0.3.8
      - name: Upload stable ASCII filename and verify digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp '水印小屋-0.3.8-arm64-release.apk' watermark-house-0.3.8-arm64-release.apk
          sha256sum watermark-house-0.3.8-arm64-release.apk > SHA256.txt
          sha256sum --check SHA256.txt
          gh release upload android-v0.3.8 watermark-house-0.3.8-arm64-release.apk SHA256.txt --clobber
          expected="sha256:$(sha256sum watermark-house-0.3.8-arm64-release.apk | cut -d' ' -f1)"
          actual="$(gh api "repos/${GH_REPO}/releases/tags/android-v0.3.8" --jq '.assets[] | select(.name == "watermark-house-0.3.8-arm64-release.apk") | .digest')"
          test "$actual" = "$expected"
          old_id="$(gh api "repos/${GH_REPO}/releases/tags/android-v0.3.8" --jq '.assets[] | select(.name == "-0.3.8-arm64-release.apk") | .id')"
          if [[ -n "$old_id" ]]; then
            gh api -X DELETE "repos/${GH_REPO}/releases/assets/${old_id}"
          fi
